apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: food-delivery-system
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: malakasadeep/fds-notification-service-v2:latest
        ports:
        - containerPort: 5005
        env:
        - name: PORT
          value: "5005"
        - name: MONGO_URL
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: notification-service-mongodb-url
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: jwt-secret
        - name: EMAIL_SERVICE
          valueFrom:
            secretKeyRef:
              name: email-sms-secrets
              key: email-service
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: email-sms-secrets
              key: email-user
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-sms-secrets
              key: email-password        - name: SMS_API_KEY
          valueFrom:
            secretKeyRef:
              name: email-sms-secrets
              key: sms-api-key
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.2"
            memory: "256Mi"
        # Temporary: removing health check probes since endpoint doesn't exist
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 5005
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /health
        #     port: 5005
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
